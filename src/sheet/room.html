<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Lembar kerja</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600&display=swap">
<style>
  /* App chrome around an imported sheet (src/sheet/player.js). Served by
     the gate for rooms of a project (docs/design/projects.md); the room
     values below are HTML-escaped into attributes by the gate. */
  :root{--primary:#a80029;--on-primary:#fff;--primary-container:#ffdad9;--on-primary-container:#40000a;
    --surface:#fff8f7;--surface-container:#fceae9;--surface-container-high:#f6e4e3;--on-surface:#231919;--on-surface-variant:#534342;
    --outline-variant:#d8c2c0;--ok:#146c2e;--e-spatial:cubic-bezier(.42,1.67,.21,.90);--e-effects:cubic-bezier(.34,.80,.34,1)}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{font-family:"Roboto Flex","Segoe UI",Roboto,Arial,sans-serif;background:#ece6e5;color:var(--on-surface);-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
  :focus-visible{outline:3px solid var(--primary);outline-offset:2px}
  ::selection{background:var(--primary-container);color:var(--on-primary-container)}
  [hidden]{display:none!important}
  .bar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:8px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));
    background:var(--surface);border-bottom:1px solid var(--outline-variant)}
  .bar h1{flex:1;min-width:0;margin:0;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--outline-variant);border-radius:8px;background:transparent;
    font-size:13px;font-weight:500;white-space:nowrap;transition:border-radius .2s var(--e-effects),background .15s}
  .chip:hover{background:var(--surface-container)}
  .chip:active{border-radius:16px}
  .chip code{font:600 13px/1 ui-monospace,Consolas,monospace;letter-spacing:.08em;color:var(--primary)}
  .status{width:8px;height:8px;border-radius:50%;background:#b3261e;flex:none;transition:background .3s}
  .status.on{background:var(--ok)}
  .peers{display:flex;align-items:center}
  .peer{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:600;border:2px solid var(--surface);margin-left:-6px}
  .peer:first-child{margin-left:0}
  .btn{height:36px;padding:0 16px;border:0;border-radius:999px;font-weight:500;font-size:14px;transition:border-radius .15s var(--e-effects),background .15s}
  .btn:active{border-radius:8px}
  .btn.p{background:var(--primary);color:var(--on-primary)}
  .btn.t{background:var(--primary-container);color:var(--on-primary-container)}
  .btn.icon{width:36px;padding:0;background:transparent;font-size:20px;line-height:1}
  .btn.icon:hover{background:var(--surface-container)}
  .menu{position:absolute;right:12px;top:calc(100% + 4px);min-width:220px;background:var(--surface-container);border-radius:16px;padding:8px 0;box-shadow:0 4px 12px rgba(0,0,0,.18)}
  .menu button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:12px 16px;font-size:14px}
  .menu button:hover{background:rgba(35,25,25,.08)}
  #sheet{padding:16px 8px 64px}
  .note{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#362f2e;color:#fbeeec;padding:12px 16px;border-radius:4px;font-size:14px;z-index:30;
    box-shadow:0 4px 12px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
  .msg{padding:48px 16px;text-align:center;color:var(--on-surface-variant)}
  .note-act{border:0;background:transparent;color:#ffb3b3;font:600 14px/1 inherit;padding:0 0 0 12px;cursor:pointer}
  /* naming dialog */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.32);display:grid;place-items:center;z-index:40;padding:16px}
  .dialog{width:min(400px,100%);background:var(--surface);border-radius:28px;padding:24px}
  .dialog p.eyebrow{margin:0 0 4px;font-size:12px;font-weight:600;color:var(--primary);letter-spacing:.4px;text-transform:uppercase}
  .dialog h2{margin:0 0 16px;font-size:24px;font-weight:500}
  .dialog input{width:100%;height:56px;border:1px solid #857372;border-radius:4px;padding:0 16px;font:inherit;font-size:16px;background:#fff}
  .dialog input:focus{outline:none;border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
  .dialog .row{display:flex;justify-content:flex-end;margin-top:20px}
  .dialog .err{color:#b3261e;font-size:13px;margin:8px 4px 0}
  .veil{position:fixed;background:var(--primary);z-index:50;pointer-events:none}
  @media (max-width:600px){.bar h1{font-size:14px}.chip .lbl{display:none}#printBtn{display:none}}
  @media print{.bar,.note{display:none!important}#sheet{padding:0}body{background:#fff}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body data-room="__ROOM_ID__" data-label="__ROOM_LABEL__" data-code="__ROOM_CODE__">
<header class="bar">
  <span class="status" id="status" title="Menyambung…"></span>
  <h1 id="title">Memuat…</h1>
  <div class="peers" id="peers" aria-label="Anggota yang online"></div>
  <button class="chip" id="codeChip" type="button" title="Salin tautan bergabung"><span class="lbl" id="roomLabel"></span><code id="roomCode"></code></button>
  <button class="btn p" id="printBtn" type="button">Cetak</button>
  <div style="position:relative">
    <button class="btn icon" id="moreBtn" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Lainnya">&#8942;</button>
    <div class="menu" id="menu" role="menu" hidden>
      <button type="button" role="menuitem" id="renameBtn">Ganti nama saya</button>
      <button type="button" role="menuitem" id="printMenuBtn">Cetak / simpan PDF</button>
      <button type="button" role="menuitem" id="resetBtn">Kosongkan semua jawaban</button>
      <button type="button" role="menuitem" id="leaveBtn">Keluar dari ruang</button>
    </div>
  </div>
</header>
<div id="sheet"><p class="msg">Memuat lembar…</p></div>
<div class="note" id="note" role="status" aria-live="polite" hidden></div>

<div class="scrim" id="nameScrim" hidden>
  <form class="dialog" id="nameForm" autocomplete="off">
    <p class="eyebrow" id="nameEyebrow"></p>
    <h2>Siapa nama Anda?</h2>
    <input id="nameInput" maxlength="40" placeholder="Nama Anda" required spellcheck="false" aria-label="Nama Anda">
    <p class="err" id="nameErr" hidden>Nama wajib diisi: anggota lain akan melihat namamu.</p>
    <div class="row"><button class="btn p" type="submit">Mulai berkolaborasi</button></div>
  </form>
</div>

<script type="module">
import { createPlayer } from '/sheet/player.js';

const $ = (id) => document.getElementById(id);
const ROOM_ID = document.body.dataset.room;
const LABEL = document.body.dataset.label || 'Kelompok';
const CODE = document.body.dataset.code || '';
const NAME_KEY = 'lkpd-cerpen-name:' + ROOM_ID; // same key as the hand-built worksheet
const CACHE_KEY = 'esh-room:' + ROOM_ID;
const PID_KEY = 'esh-pid:' + ROOM_ID;
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch { /* private mode */ } },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};

$('roomLabel').textContent = LABEL + ' ·';
$('roomCode').textContent = CODE;
$('nameEyebrow').textContent = LABEL;

/* --- the gate morphed its card into this page: fade the card out */
try {
  const h = JSON.parse(sessionStorage.getItem('lkpd-handoff') || 'null');
  sessionStorage.removeItem('lkpd-handoff');
  if (h && h.w && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
    const v = document.createElement('div');
    v.className = 'veil';
    Object.assign(v.style, { left: h.l + 'px', top: h.t + 'px', width: h.w + 'px', height: h.h + 'px', borderRadius: (h.r || 28) + 'px' });
    document.body.appendChild(v);
    v.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 300, easing: 'cubic-bezier(.34,.80,.34,1)' }).onfinish = () => v.remove();
  }
} catch { /* no handoff */ }

let noteTimer = 0;
function note(msg, ms = 3000, action) {
  const n = $('note');
  n.textContent = msg;
  if (action) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'note-act';
    b.textContent = action.label;
    b.onclick = () => { n.hidden = true; action.run(); };
    n.append(' ', b);
  }
  n.hidden = false;
  clearTimeout(noteTimer);
  if (ms) noteTimer = setTimeout(() => { n.hidden = true; }, ms);
}

/* --- identity */
let pid = store.get(PID_KEY);
if (!pid) { pid = 'p' + Math.random().toString(36).slice(2, 10); store.set(PID_KEY, pid); }
let myName = store.get(NAME_KEY) || '';
function askName(force) {
  return new Promise((resolve) => {
    if (myName && !force) { resolve(myName); return; }
    $('nameScrim').hidden = false;
    $('nameInput').value = myName;
    setTimeout(() => $('nameInput').focus(), 50);
    $('nameForm').onsubmit = (e) => {
      e.preventDefault();
      const v = $('nameInput').value.trim().slice(0, 40);
      $('nameErr').hidden = !!v;
      if (!v) return;
      myName = v;
      store.set(NAME_KEY, v);
      $('nameScrim').hidden = true;
      resolve(v);
    };
  });
}

// Never let the naming form do a native submit (a reload), even if it is
// submitted before askName() wires it; and ask while the sheet downloads.
$('nameForm').addEventListener('submit', (e) => e.preventDefault());
const named = askName(false);

/* --- presence colours, stable per peer id */
const COLORS = ['#c2185b', '#7b1fa2', '#1565c0', '#00838f', '#2e7d32', '#ef6c00', '#6d4c41', '#ad1457'];
const colorFor = (id) => { let h = 0; for (const c of String(id)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return COLORS[h % COLORS.length]; };

/* --- sheet */
let player = null;
let sheet = null;
try {
  const res = await fetch('/api/room/sheet', { credentials: 'same-origin', cache: 'no-store' });
  if (res.status === 401) { location.href = '/'; throw new Error('logged out'); }
  if (!res.ok) throw new Error('HTTP ' + res.status);
  sheet = await res.json();
  sheet._version = Number(res.headers.get('X-Sheet-Version') || 0);
} catch (e) {
  $('sheet').innerHTML = '';
  const p = document.createElement('p');
  p.className = 'msg';
  p.textContent = 'Lembar tidak bisa dimuat (' + e.message + '). Muat ulang halaman ini.';
  $('sheet').appendChild(p);
}

if (sheet) {
  document.title = sheet.title + ' · ' + LABEL;
  $('title').textContent = sheet.title;
  let cached = {};
  try { cached = JSON.parse(store.get(CACHE_KEY) || '{}'); } catch {}

  /* --- socket: the same protocol as the hand-built worksheet's room */
  let ws = null, open = false, retry = 0;
  const pending = new Map();   // field -> value not yet acknowledged by an open socket
  const sendTimers = new Map();
  const send = (m) => { if (open) try { ws.send(JSON.stringify(m)); return true; } catch {} return false; };
  const cache = () => store.set(CACHE_KEY, JSON.stringify(player.values()));
  function queueEdit(field, value) {
    pending.set(field, value);
    clearTimeout(sendTimers.get(field));
    // Coalesce keystrokes: one message per field per 120 ms.
    sendTimers.set(field, setTimeout(() => { if (send({ type: 'edit', field, value: pending.get(field) })) pending.delete(field); }, 120));
  }

  player = createPlayer($('sheet'), sheet, {
    values: cached,
    onInput(id, v) { queueEdit(id, v); cache(); },
    onFocus(id) { send({ type: 'focus', field: id }); },
  });

  let peers = [];
  function renderPeers() {
    const box = $('peers');
    box.textContent = '';
    for (const p of peers.slice(0, 6)) {
      const d = document.createElement('span');
      d.className = 'peer';
      d.style.background = colorFor(p.id);
      d.textContent = (p.name || '?').trim().slice(0, 1).toUpperCase();
      d.title = p.name + (p.id === pid ? ' (Anda)' : '');
      box.appendChild(d);
    }
    for (const p of peers) {
      if (p.id === pid) continue;
      player.setPeerFocus(p.id, p.focus, p.name, colorFor(p.id));
    }
  }
  let lastPeerIds = new Set();
  function setPeers(list) {
    const ids = new Set(list.map((p) => p.id));
    for (const old of lastPeerIds) if (!ids.has(old)) player.setPeerFocus(old, null);
    lastPeerIds = ids;
    peers = list;
    renderPeers();
  }

  function setStatus(on) {
    $('status').classList.toggle('on', on);
    $('status').title = on ? 'Tersambung' : 'Terputus: jawaban disimpan di perangkat ini dan dikirim saat tersambung lagi';
  }

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${proto}//${location.host}/ws?pid=${encodeURIComponent(pid)}&name=${encodeURIComponent(myName)}`);
    ws.onopen = () => { open = true; retry = 0; setStatus(true); };
    ws.onmessage = (ev) => {
      let m; try { m = JSON.parse(ev.data); } catch { return; }
      if (m.type === 'init') {
        // Server is the source of truth; our unsent offline edits win over it.
        const merged = { ...m.answers };
        for (const [k, v] of pending) merged[k] = v;
        player.setValues(merged);
        for (const [k, v] of pending) send({ type: 'edit', field: k, value: v });
        pending.clear();
        cache();
        setPeers(m.peers || []);
      } else if (m.type === 'edit') {
        player.setValue(m.field, m.value);
        cache();
      } else if (m.type === 'peers') {
        setPeers(m.peers || []);
      } else if (m.type === 'reset') {
        player.clear();
        store.del(CACHE_KEY);
        note('Jawaban dikosongkan oleh anggota kelompok.');
      }
    };
    ws.onclose = () => {
      open = false;
      setStatus(false);
      setTimeout(connect, Math.min(10000, 500 * 2 ** retry++));
    };
    ws.onerror = () => { try { ws.close(); } catch {} };
  }

  await named;
  connect();

  /* The teacher may re-publish mid-lesson (a typo, a new field). Answers
     live on the server, so reloading is lossless: offer it, don't force it. */
  let told = false;
  setInterval(async () => {
    if (told || document.hidden) return;
    try {
      const r = await (await fetch('/api/room/version', { credentials: 'same-origin', cache: 'no-store' })).json();
      if (r.ok && sheet._version && r.version > sheet._version) {
        told = true;
        note('Guru memperbarui lembar ini.', 0, { label: 'Muat ulang', run: () => location.reload() });
      }
    } catch { /* offline: try again later */ }
  }, 60000);

  /* --- chrome */
  const menu = $('menu');
  $('moreBtn').onclick = (e) => { e.stopPropagation(); menu.hidden = !menu.hidden; $('moreBtn').setAttribute('aria-expanded', String(!menu.hidden)); };
  addEventListener('click', (e) => { if (!menu.hidden && !menu.contains(e.target)) { menu.hidden = true; $('moreBtn').setAttribute('aria-expanded', 'false'); } });
  $('printBtn').onclick = $('printMenuBtn').onclick = () => window.print();
  $('renameBtn').onclick = async () => { menu.hidden = true; await askName(true); send({ type: 'name', name: myName }); };
  $('resetBtn').onclick = () => {
    menu.hidden = true;
    if (!confirm('Kosongkan semua jawaban kelompok ini? Ini berlaku untuk semua anggota.')) return;
    send({ type: 'reset' });
    player.clear();
    store.del(CACHE_KEY);
  };
  $('leaveBtn').onclick = async () => {
    try { await fetch('/api/logout', { credentials: 'same-origin' }); } catch {}
    location.href = '/';
  };
  $('codeChip').onclick = async () => {
    const link = `${location.origin}/j/${CODE}`;
    try { await navigator.clipboard.writeText(link); note('Tautan bergabung disalin: ' + link); }
    catch { note('Kode ruang: ' + CODE); }
  };
}
</script>
</body>
</html>
