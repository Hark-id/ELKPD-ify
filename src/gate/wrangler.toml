name = "lkpd-cerpen-gate"
# The deployable layout is assembled by scripts/sync.mjs from src/, so the
# output directory is build/gate/public — NOT public/. A Git-connected
# Pages build must use the same path (Build output directory in the
# dashboard), or it will deploy an empty folder.
pages_build_output_dir = "build/gate/public"
compatibility_date = "2025-11-01"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "WorksheetRoom"
script_name = "lkpd-cerpen-rooms"

[[durable_objects.bindings]]
name = "REGISTRY"
class_name = "RoomRegistry"
script_name = "lkpd-cerpen-rooms"

[[durable_objects.bindings]]
name = "ACCOUNTS"
class_name = "AccountStore"
script_name = "lkpd-cerpen-rooms"

[[durable_objects.bindings]]
name = "PROJECT"
class_name = "Project"
script_name = "lkpd-cerpen-rooms"
